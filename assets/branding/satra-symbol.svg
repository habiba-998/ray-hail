<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SATRA symbol">
  <title>SATRA</title>
  <!-- observation beam: from the satellite down to the parcel that needs inspection -->
  <polygon points="45,12 40.5,46 58,46" fill="#168C86" opacity="0.2"/>
  <!-- centre-pivot field seen from above: disc, irrigated ring and pivot arm -->
  <circle cx="21" cy="45" r="15" fill="#174D3A"/>
  <circle cx="21" cy="45" r="8.5" fill="none" stroke="#F6F7F2" stroke-width="1.4" opacity="0.5"/>
  <path d="M21 45 L31.5 34.5" stroke="#F6F7F2" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <circle cx="21" cy="45" r="1.9" fill="#F6F7F2"/>
  <!-- rectangular parcel with crop rows -->
  <rect x="40" y="30" width="18" height="13" rx="2.5" fill="#174D3A"/>
  <path d="M45 33v7M49 33v7M53 33v7" stroke="#F6F7F2" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  <!-- the parcel flagged for inspection -->
  <rect x="40" y="46" width="18" height="14" rx="2.5" fill="#D99A2B"/>
  <circle cx="49" cy="53" r="2.6" fill="#F6F7F2"/>
  <!-- orbit -->
  <path d="M4 31 C12 14 34 6 60 9" fill="none" stroke="#142B45" stroke-width="2.6" stroke-linecap="round"/>
  <!-- satellite: body + two solar panels -->
  <g transform="translate(45 8.5) rotate(-10)">
    <rect x="-10.5" y="-2" width="6" height="4" rx="0.8" fill="#168C86"/>
    <rect x="4.5" y="-2" width="6" height="4" rx="0.8" fill="#168C86"/>
    <rect x="-3.5" y="-3.5" width="7" height="7" rx="1.6" fill="#142B45"/>
  </g>
</svg>
